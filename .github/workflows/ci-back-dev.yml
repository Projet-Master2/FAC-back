name: CI Back - Development
#Commentaire pour relancer le pipeline avec un push
on:
  push:
    branches:
      - develop
    paths:
      - src/**
      - prisma/**
      - middleware.ts
      - next.config.ts
      - prisma.config.ts
      - tsconfig.json
      - vitest.config.ts
      - eslint.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/ci-back-*.yml

  pull_request:
    branches:
      - develop
    paths:
      - src/**
      - prisma/**
      - middleware.ts
      - next.config.ts
      - prisma.config.ts
      - tsconfig.json
      - vitest.config.ts
      - eslint.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/ci-back-*.yml

concurrency:
  group: ci-back-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Base dédiée CI pour exécuter les tests sans impacter la base de dev partagée.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # Secrets de tests de la CI.
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}

      NODE_ENV: test

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Génération du client Prisma
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Analyse statique ESLint
      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      # 6. Vérification TypeScript
      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      # 7. Tests automatisés et rapport de couverture
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-back-dev-${{ github.run_id }}
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      # 8. Compilation Next.js
      - name: Build API
        env:
          NODE_ENV: production
        run: npm run build

  migrate-and-deploy-development:
    name: Migrate and deploy to Vercel Development
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: quality-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: development

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Base Neon de développement uniquement.
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate deployment environment
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DEV_DATABASE_URL is not available"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not available"
            exit 1
          fi

      # Application des migrations enregistrées dans prisma/migrations.
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Verify Vercel project access
        run: |
          npx vercel@latest project inspect "$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

      - name: Pull Vercel configuration
        run: >
          npx vercel@latest pull
          --yes
          --environment=preview
          --git-branch=develop
          --token="$VERCEL_TOKEN"

      - name: Build Vercel API
        run: >
          npx vercel@latest build
          --token="$VERCEL_TOKEN"

      - name: Deploy API to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel@latest deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN"

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Check deployed API
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"

      - name: Deployment summary
        run: |
          echo "## Back-End development deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrations applied successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "API deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
