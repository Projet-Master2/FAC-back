name: CI Back - Production
#Commentaire de rédéploiment n°1

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - src/**
      - prisma/**
      - middleware.ts
      - next.config.ts
      - prisma.config.ts
      - tsconfig.json
      - vitest.config.ts
      - eslint.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/ci-back-*.yml

  pull_request:
    branches:
      - main
    paths:
      - src/**
      - prisma/**
      - middleware.ts
      - next.config.ts
      - prisma.config.ts
      - tsconfig.json
      - vitest.config.ts
      - eslint.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/ci-back-*.yml

concurrency:
  group: ci-back-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # La CI continue d'utiliser sa base dédiée.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # Secrets dédiés aux tests CI.
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}

      NODE_ENV: test

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Génération du client Prisma
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Analyse statique ESLint
      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      # 6. Vérification TypeScript
      - name: Run TypeScript type checking
        run: npx tsc --noEmit

      # 7. Tests automatisés et rapport de couverture
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-back-prod-${{ github.run_id }}
          path: coverage
          if-no-files-found: warn
          retention-days: 14

      # 8. Compilation Next.js
      - name: Build API
        env:
          NODE_ENV: production
        run: npm run build


  migrate-and-deploy-production:
    name: Migrate and deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: quality-and-test

    # Aucun déploiement lors d'une Pull Request.
    # Le déploiement PROD a uniquement lieu après un push sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    env:
      # Secrets Vercel Production
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Base Neon Production
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Sentry Production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Vérification des secrets nécessaires au déploiement.
      - name: Validate deployment environment
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL is not available"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID is not available"
            exit 1
          fi

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not available"
            exit 1
          fi

          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not available"
            exit 1
          fi

      # Application des migrations enregistrées dans prisma/migrations
      # sur la base Neon Production.
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      # Récupération des variables Vercel de l'environnement Production.
      - name: Pull Vercel Production configuration
        run: >
          npx vercel@latest pull
          --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      # Build Vercel avec la configuration Production.
      - name: Build Vercel API
        run: >
          npx vercel@latest build
          --prod
          --token="$VERCEL_TOKEN"

      # Déploiement réel en Production.
      - name: Deploy API to Vercel Production
        id: deploy
        run: |
          DEPLOYMENT_URL="$(
            npx vercel@latest deploy \
              --prebuilt \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN"
          )"

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $DEPLOYMENT_URL"

      # Vérification de la route de santé sur le déploiement obtenu.
      - name: Check deployed API
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "${{ steps.deploy.outputs.url }}/api/health"

      - name: Deployment summary
        run: |
          echo "## Back-End Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality checks and automated tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production database migrations applied successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "API Production deployment completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"